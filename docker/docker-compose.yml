services:
  postgres:
    image: postgres:16-alpine
    container_name: everafter-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: everafter
      POSTGRES_PASSWORD: everafter_dev
      POSTGRES_DB: everafter_dev
    volumes:
      - everafter_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U everafter -d everafter_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  everafter_pgdata:
    driver: local
